app = "axiom-realtime-gateway"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "deploy/gateway.Dockerfile"

[deploy]
  strategy = "rolling"
  release_command = "node packages/persistence/dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
